name: One-shot baseline from validated artifact
on:
  push:
    branches: [gpt/reader-gap-reconcile-20261011]
permissions:
  contents: write
  actions: read
jobs:
  lock-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download exact CI artifact and rebuild baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coneqa
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11706253579/zip > /tmp/coneqa.zip
          unzip -q /tmp/coneqa.zip -d /tmp/coneqa
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          artifact = Path('/tmp/coneqa')
          baseline_path = Path('visual-baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          pages = {}
          for i in range(1, 44):
              p = artifact / f'page-{i:02d}.png'
              if not p.exists():
                  raise SystemExit(f'missing artifact screenshot: {p.name}')
              data = p.read_bytes()
              pages[p.name] = {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          baseline.update({
              'schemaVersion': 1,
              'project': 'חרוט חדש',
              'sourceCommit': '620c9377a176ffd8e84e8578db0ac5be01e167ba',
              'sourceWorkflowRun': 38150305044,
              'artifact': 'cone-visual-qa',
              'reviewedBy': 'ChatGPT — post-PR #20 reader-gap reconciliation; all functional browser QA passed and this baseline is generated byte-for-byte from CI artifact 11706253579',
              'reviewedAt': '2026-10-11',
              'pageCount': 43,
              'pages': pages,
          })
          baseline_path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/one-shot-baseline-from-artifact.yml
      - name: Commit exact artifact-derived baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-baseline.json .github/workflows/one-shot-baseline-from-artifact.yml
          git commit -m "test(visual): lock exact CI artifact baseline"
          git push origin HEAD:gpt/reader-gap-reconcile-20261011
