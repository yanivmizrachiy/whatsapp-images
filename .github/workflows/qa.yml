name: Cone Workbook QA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'exports/student-pages/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify canonical project identity (fast, no browser)
        run: npm run guard:target && node --test tests/verify-project-target.test.mjs
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run student workbook contract QA
        run: npm run qa
      - name: Enforce progress update on pull request
        if: github.event_name == 'pull_request'
        run: node progress-qa.mjs "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA"
      - name: Enforce progress update on push
        if: github.event_name == 'push'
        run: node progress-qa.mjs "${{ github.event.before }}" "$GITHUB_SHA"
      - name: Run browser A4/mobile/print/PDF QA
        run: npm run qa:browser
      - name: Persist validated student workbook exports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p exports/student-pages
          # Clear previously-persisted page images first so pages removed by a merge
          # (e.g. 46->45) cannot linger as orphaned PNGs that match no workbook page.
          rm -f exports/student-pages/page-*.png
          cp qa-artifacts/cone-student.pdf exports/student-pages/cone-student.pdf
          cp qa-artifacts/page-*.png exports/student-pages/
          cp qa-artifacts/cover.png exports/student-pages/cover.png
          printf 'Generated from commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > exports/student-pages/GENERATED_FROM.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A exports/student-pages
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist validated student workbook exports [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload visual and PDF QA evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cone-visual-qa
          path: qa-artifacts/*
          if-no-files-found: warn
          retention-days: 7
