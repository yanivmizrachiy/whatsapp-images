name: Cone Workbook QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run student workbook contract QA
        run: npm run qa
      - name: Run browser A4/mobile/print/PDF QA
        run: npm run qa:browser
      - name: Upload visual and PDF QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cone-visual-qa
          path: qa-artifacts/*
          if-no-files-found: warn
          retention-days: 7
