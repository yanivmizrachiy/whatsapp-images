name: Cone Workbook QA

on:
  push:
    branches: [main]
    paths-ignore:
      - 'exports/student-pages/**'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QA dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run student workbook contract QA
        run: npm run qa
      - name: Run browser A4/mobile/print/PDF QA
        run: npm run qa:browser
      - name: Persist validated student workbook exports
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p exports/student-pages
          cp qa-artifacts/cone-student.pdf exports/student-pages/cone-student.pdf
          cp qa-artifacts/page-*.png exports/student-pages/
          printf 'Generated from commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > exports/student-pages/GENERATED_FROM.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/student-pages
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist validated student workbook exports [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload visual and PDF QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cone-visual-qa
          path: qa-artifacts/*
          if-no-files-found: warn
          retention-days: 7
