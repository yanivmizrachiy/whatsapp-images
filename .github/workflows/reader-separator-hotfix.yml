name: Reader separator hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reader-separator-hotfix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SSOT and reader/footer contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ssot = Path('SOURCE_OF_TRUTH.md')
          s = ssot.read_text(encoding='utf-8')
          s = s.replace('18.2. מעליהן קו כחול אחיד וסמל מחוזי מאומת אם קיים בנכס המקור.', '18.2. מעליהן **קו כחול אחיד לכל רוחב דף ה־A4, מקצה לקצה**, וסמל מחוזי מאומת אם קיים בנכס המקור. מותר לטקסט ה־footer להיות פנימי בשוליים, אך הקו עצמו חייב להישאר ברוחב מלא.')
          open_old = '- הקישור הציבורי נפתח **תמיד** בגלילה רציפה אנכית של כל דפי התלמיד לפי הסדר; אין מסך בחירה ואין מצב „דף בודד” גלוי.'
          open_new = '- הקישור הציבורי נפתח **תמיד** בגלילה רציפה אנכית של כל דפי התלמיד לפי הסדר; **מיד עם פתיחת הקישור ניתן לגלול כלפי מטה ברצף**, בלי מסך בחירה ובלי מצב „דף בודד” גלוי.'
          if open_new not in s:
              assert open_old in s
              s = s.replace(open_old, open_new, 1)
          sep_old = '- קישור־עומק `#page=N` נשמר (פתיחה ישירה בדף המבוקש). מותר `scroll-snap` עדין (`proximity`) והפרדה ויזואלית בין הדפים; גאומטריית ה־A4 (סעיף 16), התוכן, 43 הדפים ו־82 השאלות אינם משתנים כחלק משינויי הקורא.'
          sep_new = '- קישור־עומק `#page=N` נשמר (פתיחה ישירה בדף המבוקש). מותר `scroll-snap` עדין (`proximity`). **בין דף לדף אין שום כותרת/תווית כגון „עמוד X מתוך N”; ההפרדה היחידה בתצוגה היא קו כחול מלא לכל רוחב הדף.** הטקסט „עמוד X מתוך N” מופיע רק בתוך בורר העמוד ה־sticky. גאומטריית ה־A4 (סעיף 16), התוכן, 43 הדפים ו־82 השאלות אינם משתנים כחלק משינויי הקורא.'
          if sep_new not in s:
              assert sep_old in s
              s = s.replace(sep_old, sep_new, 1)
          ssot.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          h = idx.read_text(encoding='utf-8')
          anchor = '    .scroll-view .page{scroll-snap-align:start;scroll-margin-top:68px}\n'
          rule = '    .scroll-view .page:not(:last-child){box-shadow:0 3px 0 #1d4ed8}\n'
          if rule not in h:
              assert anchor in h
              h = h.replace(anchor, anchor + rule, 1)
          idx.write_text(h, encoding='utf-8')

          styles = Path('styles.css')
          c = styles.read_text(encoding='utf-8')
          old = 'right:16mm;left:16mm;bottom:4mm;border-top:1.5px solid var(--deep);padding-top:3mm;height:18mm'
          new = 'right:0;left:0;bottom:4mm;border-top:1.5px solid var(--deep);padding:3mm 16mm 0;height:18mm'
          if new not in c:
              assert old in c
              c = c.replace(old, new, 1)
          styles.write_text(c, encoding='utf-8')

          qa = Path('qa.mjs')
          q = qa.read_text(encoding='utf-8')
          marker = "ok((index.match(/class=\"reader-action[^\"]*\"/g)||[]).length===1&&index.includes('class=\"reader-action download-pdf\"'),'exactly one visible reader action is allowed: הורדת PDF');"
          extra = "\nok(index.includes('.scroll-view .page:not(:last-child){box-shadow:0 3px 0 #1d4ed8}'),'continuous reader must separate pages only with a full-width blue line');\nok(!index.includes('sheet-label'),'continuous reader must not render per-page labels such as עמוד X מתוך N outside the selector');\nok(/\\.gz-footer\\{[^}]*right:0;left:0;[^}]*border-top:1.5px solid var\\(--deep\\)/.test(css),'footer blue rule must span the full A4 width');"
          if 'continuous reader must separate pages only with a full-width blue line' not in q:
              assert marker in q
              q = q.replace(marker, marker + extra, 1)
          qa.write_text(q, encoding='utf-8')

          rqa = Path('reader-jump-qa.mjs')
          r = rqa.read_text(encoding='utf-8')
          marker2 = "ok(index.includes('reader-jump.js'),'direct page-jump controller must be loaded');"
          extra2 = "\nok(index.includes('.scroll-view .page:not(:last-child){box-shadow:0 3px 0 #1d4ed8}'),'reader must use a full-width blue line as the only between-page separator');\nok(!index.includes('sheet-label'),'reader must not show page-count labels between pages');"
          if 'only between-page separator' not in r:
              assert marker2 in r
              r = r.replace(marker2, marker2 + extra2, 1)
          rqa.write_text(r, encoding='utf-8')

          progress = Path('STUDENT_PROGRESS.json')
          d = json.loads(progress.read_text(encoding='utf-8'))
          d['updatedAt'] = '2026-10-11T11:09:00+03:00'
          d['updatedBy'] = 'ChatGPT direct repo agent — Yaniv 2026-10-11 reader/footer requirement: SSOT §18.2 full-width blue footer rule; SSOT §20.3 immediate vertical scroll, no per-page labels between pages, blue-only full-width separator, sticky page selector remains the sole page-number display; canonical + browser + visual evidence are generated in the same hotfix workflow.'
          d['headCommit'] = 'pending-reader-separator-hotfix'
          d['readerUx20261011'] = 'Current canonical reader requirement: 43 pages / 82 questions unchanged; immediate continuous downward scrolling; selector + PDF only; direct fade jump; no between-page page-count labels; full-width blue separator; full-width blue rule above footer text.'
          progress.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fast canonical QA
        run: npm run qa
      - name: Browser visual evidence
        run: |
          node browser-qa.mjs
          node student-display-policy-browser-qa.mjs
      - name: Refresh reviewed visual baseline for approved visual change
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          files=sorted(Path('qa-artifacts').glob('page-*.png'))
          assert len(files)==43, f'expected 43 screenshots, got {len(files)}'
          pages={}
          for p in files:
              b=p.read_bytes()
              pages[p.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          data={
            'schemaVersion':1,
            'project':'חרוט חדש',
            'sourceCommit':'PENDING_CONTENT_COMMIT',
            'sourceWorkflowRun':int(os.environ['GITHUB_RUN_ID']),
            'artifact':'cone-visual-qa',
            'reviewedBy':'Yaniv requirement + ChatGPT direct repo agent — approved full-width footer rule and blue-only page separators; canonical/browser QA passed in this run',
            'reviewedAt':'2026-10-11',
            'pageCount':43,
            'pages':pages,
          }
          Path('visual-baseline.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node visual-regression-qa.mjs
      - name: Persist validated exports and commit content
        shell: bash
        run: |
          mkdir -p exports/student-pages
          rm -f exports/student-pages/page-*.png
          cp qa-artifacts/cone-student.pdf exports/student-pages/cone-student.pdf
          cp qa-artifacts/page-*.png exports/student-pages/
          printf 'Generated from reader separator hotfix workflow: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > exports/student-pages/GENERATED_FROM.txt
          git config user.name "ChatGPT Repo Agent"
          git config user.email "actions@users.noreply.github.com"
          git add SOURCE_OF_TRUTH.md STUDENT_PROGRESS.json index.html styles.css qa.mjs reader-jump-qa.mjs visual-baseline.json exports/student-pages
          git commit -m "fix(reader): blue-only separators and full-width footer rule"
          CONTENT_SHA=$(git rev-parse HEAD)
          python - "$CONTENT_SHA" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path('visual-baseline.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d['sourceCommit']=sys.argv[1]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          progress=Path('STUDENT_PROGRESS.json')
          j=json.loads(progress.read_text(encoding='utf-8'))
          j['headCommit']=sys.argv[1]
          progress.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git rm .github/workflows/reader-separator-hotfix.yml
          git add visual-baseline.json STUDENT_PROGRESS.json
          git commit -m "chore(qa): record reviewed separator baseline evidence"
          git push origin HEAD:main
