name: One-shot SSOT handoff 2026-10-11

on:
  push:
    branches:
      - chatgpt/harut-student-display-policy
    paths:
      - .github/workflows/ssot-handoff-20261011.yml

permissions:
  contents: write

jobs:
  update-ssot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: chatgpt/harut-student-display-policy
          fetch-depth: 0

      - name: Append canonical Claude handoff and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq '## 27. סבב משלים 2026-10-11 — תצוגת תלמיד והעברת מקל ל-Claude Code' SOURCE_OF_TRUTH.md; then
            cat >> SOURCE_OF_TRUTH.md <<'EOF'

          ## 27. סבב משלים 2026-10-11 — תצוגת תלמיד והעברת מקל ל-Claude Code
          27.1. לאחר ש-Claude Code נעצר בגלל מגבלת session, יניב הורה להשלים את התיקונים שכבר אותרו בלי לדרוס עבודה קיימת ובלי ליצור בלגן בריפו. הסבב המשלים מנוהל ב-PR #10, ענף `chatgpt/harut-student-display-policy`, מעל `claude/merge-pages-30-31`.

          27.2. כללי התצוגה המחייבים לתלמיד בסבב זה:
          - בטבלת הנפח המונח המוצג לתלמיד הוא **„קוטר”** ולא הסימון `d` ככותרת עצמאית; מותר להשאיר `d` רק כנתון פנימי/מתמטי כאשר הוא נחוץ לחישוב או למקור נעול.
          - כל מידה מספרית שמוצגת לתלמיד כוללת יחידת מידה מתאימה; נפח מוצג עם יחידת נפח.
          - כותרת H1 היא כותרת נושא בלבד. משימת השלמת נוסחה נשארת פעילות תלמיד נפרדת ואינה מוטמעת בתוך הכותרת.
          - בכיתובי שינוי הממדים כל גודל מספרי מקבל יחידה בפני עצמו.
          - מרחב חישוב נשאר **רשת משבצות 5×5 מ״מ**; אין להחליף אותו בקווים אופקיים בלבד.

          27.3. המימוש המשלים אינו משנה עמודי מורה, נוסח רשמי נעול 1:1, מספר עמודים, IDs של שאלות או נתונים מתמטיים קנוניים. הוא משנה רק שכבת תצוגה/חיווט ו-QA ייעודי כדי להגן על הכללים לעיל.

          27.4. ראיות לפני עדכון מקור האמת: head `a3d5bbf9271469853865ad3dd6dca2a94890dcba`; Cone Workbook QA run #161 עבר בהצלחה לאחר ריענון baseline רק לעמודים שהשתנו חזותית. עברו contract, progress, math, coverage, browser A4/mobile/print/PDF ו-student-display QA.

          27.5. הוראת handoff ל-Claude Code: עם חזרת ה-session, יש לקרוא סעיף זה ואת PR #10 לפני שינוי נוסף, להשוות מול כל שינוי מקומי שטרם נשמר, **לא לדרוס אותו בעיוורון**, ולא להחזיר `d` ככותרת תלמיד, יחידות חסרות, כותרות דמו או מרחבי חישוב בקווים. אם קיימת סתירה עם שינוי מקומי חדש של יניב — פועלים לפי §1.4 ומאחדים לנוסח קנוני יחיד.

          27.6. כל עוד PR #10 לא מוזג, `main` נשאר מצב הייצור הקודם; סעיף זה מתעד את הסבב המשלים המאומת ואת אופן ההמשך הבטוח, ולא מהווה הרשאה לעקוף review/QA/merge.
          EOF
          fi
          rm -f .github/workflows/ssot-handoff-20261011.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_OF_TRUTH.md .github/workflows/ssot-handoff-20261011.yml
          if ! git diff --cached --quiet; then
            git commit -m 'docs(ssot): record interrupted Claude handoff'
            git push origin HEAD:chatgpt/harut-student-display-policy
          fi
