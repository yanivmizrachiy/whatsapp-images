name: One-shot question marker repair

on:
  push:
    branches:
      - chatgpt/question-marker-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/question-marker-repair
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Apply guarded repair
        run: python scripts/repair-question-markers.py
      - name: Fast QA
        run: npm run qa
      - name: Browser render QA
        run: node browser-qa.mjs && node student-display-policy-browser-qa.mjs
      - name: Refresh intended visual baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('visual-baseline.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          pages={}
          for f in sorted(Path('qa-artifacts').glob('page-*.png')):
              b=f.read_bytes()
              pages[f.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          if len(pages)!=43:
              raise SystemExit('expected 43 page screenshots, got '+str(len(pages)))
          m['sourceCommit']=os.environ.get('GITHUB_SHA','')
          m['sourceWorkflowRun']=int(os.environ.get('GITHUB_RUN_ID','0'))
          m['reviewedBy']='Yaniv explicit no-question-numbering requirement; presentation-only blue-circle repair; source wording preserved'
          m['reviewedAt']='2026-10-11'
          m['pageCount']=43
          m['pages']=pages
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node visual-regression-qa.mjs
      - name: Full browser QA with refreshed baseline
        run: npm run qa:browser
      - name: Commit verified repair
        run: |
          rm -f .github/workflows/one-shot-question-marker-repair.yml
          rm -f scripts/repair-question-markers.py
          git config user.name "chatgpt-repo-agent"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "fix(student): restore blue question markers and lock no-number rule"
          git push origin HEAD:chatgpt/question-marker-repair
