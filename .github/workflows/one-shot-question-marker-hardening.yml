name: One-shot question marker hardening

on:
  push:
    branches:
      - chatgpt/question-marker-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/question-marker-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Apply guarded hardening
        run: python scripts/harden-question-markers.py
      - name: Static QA
        run: npm run qa
      - name: Render and semantic marker audit
        run: node browser-qa.mjs && node student-display-policy-browser-qa.mjs && node question-marker-browser-qa.mjs
      - name: Refresh intended visual baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('visual-baseline.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          pages={}
          for f in sorted(Path('qa-artifacts').glob('page-*.png')):
              b=f.read_bytes(); pages[f.name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)}
          if len(pages)!=43: raise SystemExit('expected 43 screenshots, got '+str(len(pages)))
          m['sourceCommit']=os.environ.get('GITHUB_SHA','')
          m['sourceWorkflowRun']=int(os.environ.get('GITHUB_RUN_ID','0'))
          m['reviewedBy']='Yaniv explicit no-question-numbering requirement; page-1 2א hardening + semantic browser marker audit'
          m['reviewedAt']='2026-10-11'; m['pages']=pages; m['pageCount']=43
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          node visual-regression-qa.mjs
      - name: Full browser QA
        run: npm run qa:browser
      - name: Commit verified hardening
        run: |
          rm -f .github/workflows/one-shot-question-marker-hardening.yml scripts/harden-question-markers.py
          git config user.name "chatgpt-repo-agent"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "test(student): harden no-number question marker rendering"
          git push origin HEAD:chatgpt/question-marker-hardening
