name: Recover validated Harut PDF (one-shot)
on:
  push:
    branches: [claude/harut-closure-20261011]
    paths: [.github/workflows/recover-harut-pdf.yml]
permissions:
  actions: read
  contents: write
jobs:
  recover:
    if: github.repository == 'yanivmizrachiy/whatsapp-images'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: claude/harut-closure-20261011
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Download pinned successful QA artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/yanivmizrachiy/whatsapp-images/actions/artifacts/11711020890/zip" -o /tmp/validated.zip
          unzip -p /tmp/validated.zip cone-student.pdf > /tmp/cone-student.pdf
          echo "d15bedf4b6cd120b0247d2fa1df48f0433383738f7622f54d0158e130c2f7f7a  /tmp/cone-student.pdf" | sha256sum -c -
      - name: Validate cover and page count before replacing download
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { PDFDocument } from 'pdf-lib';
            const pdf=await PDFDocument.load(fs.readFileSync('/tmp/cone-student.pdf'));
            if(pdf.getPageCount()!==44) throw Error('Expected cover + 43 pages');
            const box=pdf.getPage(0).getSize();
            if(Math.abs(box.width-595.28)>3||Math.abs(box.height-841.89)>3) throw Error('Cover is not A4');
            console.log('Validated 44 A4 sheets');
          "
      - name: Commit validated PDF only to closure branch
        run: |
          cp /tmp/cone-student.pdf exports/student-pages/cone-student.pdf
          printf 'Generated from commit: a8d38572fb82d72c4c33a213d70376941b3adb1f\nWorkflow run: 38161515101\nArtifact: 11711020890\n' > exports/student-pages/GENERATED_FROM.txt
          node export-pdf-qa.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/student-pages/cone-student.pdf exports/student-pages/GENERATED_FROM.txt
          git diff --cached --quiet || { git commit -m 'fix(pdf): restore verified 44-sheet cover-inclusive download'; git push origin HEAD:claude/harut-closure-20261011; }
